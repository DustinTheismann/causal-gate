[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-rnd-foundry"
version = "0.2.0"
description = "A governed recursive self-improvement scaffold: generate successors, evaluate, learn from failures, and promote only candidates that pass novelty, causal, benchmark, containment, and HALF-LIFE assurance gates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# Standard library only. Every "model", "benchmark", "sandbox" and "proof" is
# simulated -- the governance LOGIC is the object of study, not real ML.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rsi_foundry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
